services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: h3c-netctrl-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - h3c-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: h3c-netctrl-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - h3c-net

networks:
  h3c-net:
    driver: bridge
