# ============================================================
# 容器拆分蓝图（v2.4.1 实施，v2.5 默认翻转）
# 默认 3 容器 split 模式：ctrl / config / data
# monolith 模式：docker compose --profile core up -d backend
# 详见 VERSION-ROADMAP.md
# ============================================================
services:
  # ── monolith 模式（profile: core，v2.5 从默认翻转为可选） ──
  backend:
    profiles: ["core"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: h3c-netctrl-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - h3c-netctrl-backups:/data/backups
    env_file:
      - .env
    environment:
      - SERVICE_NAME=${SERVICE_NAME:-core}
    restart: unless-stopped
    networks:
      - h3c-net

  # ── 3 容器 split 模式（默认，v2.4.1 实施，v2.5 翻转为默认） ──
  ctrl:
    build:
      context: ./backend
      dockerfile: ctrl/Dockerfile
    container_name: h3c-ctrl
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SERVICE_NAME=ctrl
      - DB_PATH=/app/data/ctrl.db
      - INTERNAL_CTRL_URL=http://ctrl:8000
      - INTERNAL_CONFIG_URL=http://config:8000
      - INTERNAL_DATA_URL=http://data:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-token}
    restart: unless-stopped
    networks:
      - h3c-net

  config:
    build:
      context: ./backend
      dockerfile: config/Dockerfile
    container_name: h3c-config
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SERVICE_NAME=config
      - DB_PATH=/app/data/config.db
      - INTERNAL_CTRL_URL=http://ctrl:8000
      - INTERNAL_CONFIG_URL=http://config:8000
      - INTERNAL_DATA_URL=http://data:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-token}
    restart: unless-stopped
    networks:
      - h3c-net

  data:
    build:
      context: ./backend
      dockerfile: data_svc/Dockerfile
    container_name: h3c-data
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - h3c-netctrl-backups:/data/backups
    env_file:
      - .env
    environment:
      - SERVICE_NAME=data
      - DB_PATH=/app/data/data.db
      - INTERNAL_CTRL_URL=http://ctrl:8000
      - INTERNAL_CONFIG_URL=http://config:8000
      - INTERNAL_DATA_URL=http://data:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-token}
    restart: unless-stopped
    networks:
      - h3c-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: h3c-netctrl-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - ./frontend/.env:/app/.env
    # v2.5: depends_on 改为 ctrl（split 模式默认）。
    # core 模式（--profile core）下 ctrl 不在启动列表，depends_on 不阻塞，frontend 仍能起。
    depends_on:
      - ctrl
    restart: unless-stopped
    networks:
      - h3c-net

  # QA 容器：跑测试，默认不起，需要时 docker compose --profile qa up qa
  qa-backend:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: backend/Dockerfile.qa
    container_name: h3c-netctrl-qa-backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # v2.4.2.1 paramiko 单元测试：qa 容器需要读 ops-toolkit/scripts/_paramiko_batch_exec.py
      - ./ops-toolkit/scripts:/opt/ops-toolkit-scripts:ro
      # v2.4.2 真机 e2e 故障注入（场景 7/8）：qa 容器需要 docker stop split 容器
      # 挂 docker.sock + docker CLI（只影响 qa 容器，prod 不受影响）
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - h3c-net

  qa-frontend:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.qa
    container_name: h3c-netctrl-qa-frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/playwright.config.js:/app/playwright.config.js
      # v2.6: 挂 package.json + package-lock.json 让 entrypoint 自动 npm install 同步新依赖
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # 挂 entrypoint 让后续调整不用重 build 镜像
      - ./backend/entrypoint-qa.sh:/usr/local/bin/entrypoint-qa.sh
      - ./frontend/tests:/app/tests
    networks:
      - h3c-net

  # 运维排错工具包（v2.3）：按需启动，预装 ping/nc/SSH/ncclient/netmiko + 5 预制脚本
  ops-toolkit:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: ops-toolkit/Dockerfile
    container_name: h3c-netctrl-ops-toolkit
    # v242-paramiko-tool: 自动注入 .env 凭据（DEVICE_USERNAME/DEVICE_PASSWORD），
    # 工具封装：user 调 `paramiko-batch-exec.sh --device test` 即可，不用每次 -e 传凭据
    env_file:
      - .env
    volumes:
      - ./ops-toolkit/captures:/captures
      # docs 挂到 /opt/docs（_print_doc_links 输出路径，build 时也 COPY 了，运行时挂载保证最新）
      - ./docs:/opt/docs:ro
    networks:
      - h3c-net
    stdin_open: true
    tty: true

networks:
  h3c-net:
    driver: bridge

# 持久化卷（v2.1.x patch 灰度：备份文件）
volumes:
  h3c-netctrl-backups:
    driver: local
