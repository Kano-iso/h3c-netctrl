# ============================================================
# 未来容器拆分蓝图（v2.1.x patch 预留，未实际拆）
# 当前 backend 服务 = monolith，承载 core + asset 业务
# v2.3 拆 asset / v3.0 加 sdn / 未来 monitor
# 详见 docs/CONTAINER-DECOUPLING.md
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: h3c-netctrl-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
      # 备份文件持久化（v2.1.x patch 灰度，对应 .env 的 BACKUP_DIR）
      - h3c-netctrl-backups:/data/backups
    env_file:
      - .env
    environment:
      # 未来拆容器时通过 SERVICE_NAME 标识实例角色
      # 当前 monolith 启动 log 输出 service_name=core
      - SERVICE_NAME=${SERVICE_NAME:-core}
    restart: unless-stopped
    networks:
      - h3c-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: h3c-netctrl-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - h3c-net

  # QA 容器：跑测试，默认不起，需要时 docker compose --profile qa up qa
  qa-backend:
    profiles: ["qa"]
    build:
      context: ./backend
      dockerfile: Dockerfile.qa
    container_name: h3c-netctrl-qa-backend
    volumes:
      - ./backend:/app
    networks:
      - h3c-net

  qa-frontend:
    profiles: ["qa"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.qa
    container_name: h3c-netctrl-qa-frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
    networks:
      - h3c-net

  # 运维排错工具包（v2.3）：按需启动，预装 ping/nc/SSH/ncclient/netmiko + 5 预制脚本
  ops-toolkit:
    profiles: ["ops"]
    build:
      context: ./ops-toolkit
      dockerfile: Dockerfile
    container_name: h3c-netctrl-ops-toolkit
    volumes:
      - ./ops-toolkit/captures:/captures
    networks:
      - h3c-net
    stdin_open: true
    tty: true

networks:
  h3c-net:
    driver: bridge

# 持久化卷（v2.1.x patch 灰度：备份文件）
volumes:
  h3c-netctrl-backups:
    driver: local
