<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H3C NetCtrl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">H3C NetCtrl</h1>

        <!-- 全局错误展示区 -->
        <div id="error-area"></div>

        <!-- 设备信息区 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">设备信息</h5>
                <button id="btn-test-conn" class="btn btn-outline-primary btn-sm">测试连接</button>
            </div>
            <div class="card-body" id="device-info">
                <p class="text-muted">加载中...</p>
            </div>
        </div>

        <!-- VLAN 管理区 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">VLAN 管理</h5>
                <div>
                    <button id="btn-refresh-vlans" class="btn btn-outline-secondary btn-sm me-2">刷新</button>
                    <button id="btn-add-vlan" class="btn btn-primary btn-sm">新增 VLAN</button>
                </div>
            </div>
            <div class="card-body">
                <div id="vlan-loading" class="text-center py-3 d-none">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    <span class="ms-2">加载中...</span>
                </div>
                <table class="table table-striped table-hover" id="vlan-table">
                    <thead>
                        <tr>
                            <th>VLAN ID</th>
                            <th>VLAN 名称</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="vlan-tbody">
                    </tbody>
                </table>
                <p id="vlan-empty" class="text-muted text-center d-none">暂无VLAN数据</p>
            </div>
        </div>
    </div>

    <!-- 设备配置弹窗 -->
    <div class="modal fade" id="deviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deviceModalTitle">配置设备</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="device-form">
                        <div class="mb-3">
                            <label class="form-label">设备名称</label>
                            <input type="text" class="form-control" id="device-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">IP 地址</label>
                            <input type="text" class="form-control" id="device-host" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">端口</label>
                            <input type="number" class="form-control" id="device-port" value="830" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="device-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="device-password" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="btn-save-device">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- VLAN 新增/编辑弹窗 -->
    <div class="modal fade" id="vlanModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="vlanModalTitle">新增 VLAN</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vlan-form">
                        <div class="mb-3">
                            <label class="form-label">VLAN ID</label>
                            <input type="number" class="form-control" id="vlan-id" min="1" max="4094" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">VLAN 名称</label>
                            <input type="text" class="form-control" id="vlan-name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="btn-save-vlan">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="delete-message"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="btn-confirm-delete">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/device.js"></script>
    <script src="/js/vlan.js"></script>
</body>
</html>
